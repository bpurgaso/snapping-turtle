<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Deterministic font resolution for the flat renderer (PLAN.md §10).
  FONTCONFIG_PATH points here (set by server/src/images/fonts.ts and the
  Docker image), so librsvg sees exactly one font: the pinned Inter vendored
  in shared/fonts. Paths are relative to this file, which holds in the repo
  (server/fontconfig -> ../../shared/fonts) and in the runtime image
  (/app/server/fontconfig -> /app/shared/fonts) alike.
-->
<fontconfig>
  <dir prefix="relative">../../shared/fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>system-ui</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Inter</string></edit>
  </match>
</fontconfig>
