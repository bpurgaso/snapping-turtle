# snapping-turtle — PLAN.md §14. Run from the repo root:
#   docker compose -f deploy/docker-compose.yml up -d --build
# Configuration comes from deploy/.env (copy deploy/.env.example).

name: snapping-turtle

services:
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST in deploy/.env}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-30}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]
    depends_on:
      app:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          memory: 256M

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: snapping-turtle/app:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      TRUST_PROXY: 'true'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PUBLIC_ORIGIN: https://${PUBLIC_HOST:?set PUBLIC_HOST in deploy/.env}
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-snapping_turtle}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in deploy/.env}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-30}
      RETENTION_DEFAULT_DAYS: ${RETENTION_DEFAULT_DAYS:-30}
      RETENTION_MAX_DAYS_USER: ${RETENTION_MAX_DAYS_USER:-365}
      RATE_GENERAL_PER_MIN: ${RATE_GENERAL_PER_MIN:-60}
      RATE_INVALID_LOOKUP_BUDGET: ${RATE_INVALID_LOOKUP_BUDGET:-5}
      RATE_INVALID_LOOKUP_WINDOW_MIN: ${RATE_INVALID_LOOKUP_WINDOW_MIN:-10}
      RATE_BREAKER_INVALID_PER_MIN: ${RATE_BREAKER_INVALID_PER_MIN:-100}
      # Only consumed by `docker compose run --rm app node dist/db/seed.js`.
      ADMIN_BOOTSTRAP_USER: ${ADMIN_BOOTSTRAP_USER:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
    volumes:
      - images:/data/images
    tmpfs:
      - /tmp:size=64m,mode=1777
    read_only: true
    user: node
    networks: [web, internal]
    depends_on:
      postgres:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          memory: 1G

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-snapping_turtle}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 6
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  web:
  internal:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  images:
  pgdata:
