# snapping-turtle — PLAN.md §14. Run from the repo root:
#   docker compose -f deploy/docker-compose.yml up -d --build
# Configuration comes from deploy/.env (copy deploy/.env.example).
#
# Containment (PLAN.md §14 "Container hardening"): a compromise of any one
# container — most plausibly caddy or app, the two that touch request bytes —
# must stay inside it. Every service runs as a fixed non-root uid with all
# capabilities dropped, no-new-privileges, a read-only root filesystem (tmpfs
# for scratch), a memory limit and bounded logs; images are pinned by tag and
# digest; postgres sits on an internal-only network that caddy is not on.
# The uids are part of the data layout: the named volumes must be owned by
# them (deploy/README.md "Upgrading an existing deployment to the non-root
# services" for a stack that predates this).

name: snapping-turtle

# The hardening block every service merges with `<<: *hardened` (compose
# ignores top-level x-* keys). What differs per service — the uid, the tmpfs
# paths it writes, the memory limit — stays on the service with its reason.
x-hardened: &hardened
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  read_only: true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  caddy:
    <<: *hardened
    build:
      context: .
      dockerfile: Dockerfile.caddy
    image: snapping-turtle/caddy:local
    # The stock image has no unprivileged user; Caddy needs none. 1000:1000
    # is an arbitrary fixed uid (the same number the app's `node` user has,
    # for one chown recipe). PUBLIC_PORT is above 1024, so binding it needs
    # no capability, and the admin endpoint stays on loopback inside the
    # container. caddy_data and caddy_config must be owned by 1000:1000.
    user: '1000:1000'
    # The one inbound port (PLAN.md §14): TCP for HTTP/1.1 and HTTP/2, UDP for
    # HTTP/3. Nothing is published on 80 or 443 and nothing may be — TLS is
    # issued via DNS-01, which needs no inbound connection, and the Caddyfile
    # disables the :80 redirect server. Not a defence (scanners sweep every
    # port); conflict avoidance and surface reduction only.
    # PUBLIC_BIND_IP narrows the listener to the one host address the
    # router forwards to (deploy/.env); unset, it binds every interface,
    # which local runs and the rehearsal scripts rely on.
    ports:
      - '${PUBLIC_BIND_IP:-0.0.0.0}:${PUBLIC_PORT:-28443}:${PUBLIC_PORT:-28443}'
      - '${PUBLIC_BIND_IP:-0.0.0.0}:${PUBLIC_PORT:-28443}:${PUBLIC_PORT:-28443}/udp'
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST in deploy/.env}
      PUBLIC_PORT: ${PUBLIC_PORT:-28443}
      # Read by Caddy from its environment for the DNS-01 challenge; it is
      # never placed in the Caddyfile or in any log (CLAUDE.md rules 3, 12).
      # Empty under docker-compose.local.yml (internal CA, no ACME).
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-30}
      CADDY_RATE_PER_IP_PER_MIN: ${CADDY_RATE_PER_IP_PER_MIN:-300}
    volumes:
      # Read-only binds from this directory: the site config is operator
      # state that changes without a rebuild (docker-compose.local.yml swaps
      # the Caddyfile; a domain migration drops a block into caddy.d and
      # runs `up -d`), so it is not baked into the image.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Extra site blocks (old-domain redirect during a domain migration).
      - ./caddy.d:/etc/caddy/sites.d:ro
      # Certificates and ACME account (XDG_DATA_HOME) / autosaved config
      # (XDG_CONFIG_HOME): the only two places Caddy writes.
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks: [web]
    depends_on:
      app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  app:
    <<: *hardened
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: snapping-turtle/app:local
    # The image's `node` user (deploy/Dockerfile `USER node`), by number so
    # the uid is fixed here and not looked up in the image's passwd. Owns
    # the images volume; the backup sidecar reads it as the same uid.
    user: '1000:1000'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      # §12: trust X-Forwarded-For only from the compose `web` network, where
      # Caddy lives — a spoofed header from anywhere else must not be able to
      # aim guard bans at other people's IPs.
      TRUST_PROXY: ${TRUST_PROXY:-172.28.101.0/24}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # The single source of truth for every generated URL (page links, image
      # links, /ext/updates.json). Derived here so it always carries the
      # published port; the app refuses to boot if PUBLIC_PORT disagrees.
      PUBLIC_ORIGIN: https://${PUBLIC_HOST:?set PUBLIC_HOST in deploy/.env}:${PUBLIC_PORT:-28443}
      PUBLIC_PORT: ${PUBLIC_PORT:-28443}
      # Runtime role (rule 7): st_app has no UPDATE/DELETE grant on audit_log.
      DATABASE_URL: postgres://st_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-snapping_turtle}
      # Privileged role: owns the schema; used only for migrations at boot and
      # to sync st_app's password (start.ts). Also used by db:seed.
      MIGRATE_DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-snapping_turtle}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in deploy/.env}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-30}
      RETENTION_DEFAULT_DAYS: ${RETENTION_DEFAULT_DAYS:-30}
      RETENTION_MAX_DAYS_USER: ${RETENTION_MAX_DAYS_USER:-365}
      TOMBSTONE_DAYS: ${TOMBSTONE_DAYS:-90}
      RATE_GENERAL_PER_MIN: ${RATE_GENERAL_PER_MIN:-60}
      RATE_INVALID_LOOKUP_BUDGET: ${RATE_INVALID_LOOKUP_BUDGET:-5}
      RATE_INVALID_LOOKUP_WINDOW_MIN: ${RATE_INVALID_LOOKUP_WINDOW_MIN:-10}
      RATE_BREAKER_INVALID_PER_MIN: ${RATE_BREAKER_INVALID_PER_MIN:-100}
      RATE_BREAKER_COOLDOWN_SECONDS: ${RATE_BREAKER_COOLDOWN_SECONDS:-300}
      RATE_BAN_LADDER_MINUTES: ${RATE_BAN_LADDER_MINUTES:-15,60,1440}
      RATE_NOT_FOUND_JITTER_MIN_MS: ${RATE_NOT_FOUND_JITTER_MIN_MS:-30}
      RATE_NOT_FOUND_JITTER_MAX_MS: ${RATE_NOT_FOUND_JITTER_MAX_MS:-150}
      # Guard alerting webhook (E12, §12): bans and breaker transitions, rate
      # limited, secret-free. Empty = off. The URL is a credential: it reaches
      # the app's environment only, never a log line.
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      LOGIN_THROTTLE_FREE_ATTEMPTS: ${LOGIN_THROTTLE_FREE_ATTEMPTS:-5}
      LOGIN_THROTTLE_BASE_SECONDS: ${LOGIN_THROTTLE_BASE_SECONDS:-5}
      LOGIN_THROTTLE_MAX_SECONDS: ${LOGIN_THROTTLE_MAX_SECONDS:-3600}
      IMAGES_DIR: /data/images
      # Signed Firefox .xpi + updates.json, published by
      # `pnpm --filter extension sign:firefox` into deploy/ext (§15, M8).
      EXT_DIR: /data/ext
      # The unlisted Chrome Web Store listing, once approved (E2): the home
      # page's Chrome install button. Empty = "coming soon".
      CHROME_EXTENSION_URL: ${CHROME_EXTENSION_URL:-}
      # Only consumed by `docker compose run --rm app node dist/db/seed.js`.
      ADMIN_BOOTSTRAP_USER: ${ADMIN_BOOTSTRAP_USER:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
    volumes:
      - images:/data/images
      # Read-only bind: sign:firefox publishes a new .xpi here and the app
      # serves it on the next request, with no rebuild (deploy/ext/README.md).
      - ./ext:/data/ext:ro
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks: [web, internal]
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

  # Nightly backups (PLAN.md §12): pg_dump + hardlinked image snapshots into
  # the `backups` volume, and — when RESTIC_REPOSITORY/RESTIC_PASSWORD are set
  # — a restic snapshot off-box. `backup run` for an ad-hoc backup,
  # deploy/backup/verify-restore.sh to prove the latest one restores.
  backup:
    <<: *hardened
    build:
      context: .
      dockerfile: Dockerfile.backup
    image: snapping-turtle/backup:local
    # The image's `backup` user (Dockerfile.backup), stated here as well so
    # compose pins it. uid 1000 on purpose: the read-only images volume is
    # the app's, 0750/0640, and the same uid reads it without loosening that.
    user: '1000:1000'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-snapping_turtle}
      BACKUP_TIME_UTC: ${BACKUP_TIME_UTC:-03:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_ON_START: ${BACKUP_ON_START:-false}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      RESTIC_KEEP_DAILY: ${RESTIC_KEEP_DAILY:-14}
      RESTIC_KEEP_WEEKLY: ${RESTIC_KEEP_WEEKLY:-8}
      RESTIC_KEEP_MONTHLY: ${RESTIC_KEEP_MONTHLY:-6}
      # Backend credentials for restic, passed through only when set.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      B2_ACCOUNT_ID: ${B2_ACCOUNT_ID:-}
      B2_ACCOUNT_KEY: ${B2_ACCOUNT_KEY:-}
    volumes:
      - images:/data/images:ro
      - backups:/backups
    tmpfs:
      - /tmp:size=256m,mode=1777
    networks: [internal, egress]
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  postgres:
    <<: *hardened
    # Authoritative pin (scripts/check-image-pins.sh syncs every other site).
    # Explicit patch tag on purpose: `up -d --build` never re-pulls a cached
    # floating tag, and Dependabot can only bump a literal — see
    # deploy/README.md "The Postgres image pin". The digest makes the pin
    # exact: a tag can be re-pointed upstream, a manifest digest cannot.
    # Dependabot moves tag and digest together; the pin check holds
    # deploy/Dockerfile.backup to both.
    image: postgres:16.15-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    # The image's `postgres` user (uid 70 on alpine). Started as non-root the
    # entrypoint skips its chown + gosu step and runs the server directly, so
    # pgdata must already belong to 70:70 — which it does for every volume
    # the root-started entrypoint initialised; the README's upgrade step
    # verifies that before the first non-root start. 5432 needs no capability.
    user: '70:70'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-snapping_turtle}
    volumes:
      - pgdata:/var/lib/postgresql/data
    tmpfs:
      # The unix socket (pg_isready in the healthcheck connects through it)
      # and the server's scratch; everything else it writes is in pgdata.
      - /run/postgresql:size=4m,mode=0770,uid=70,gid=70
      - /tmp:size=64m,mode=1777
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  # Fixed subnet so the app's TRUST_PROXY can name exactly the network Caddy
  # connects from (§12). Change both together if this range clashes locally.
  web:
    ipam:
      config:
        - subnet: 172.28.101.0/24
  # Database network: app and backup reach postgres here and nowhere else.
  # `internal` means no gateway — nothing on it can reach the outside, and
  # caddy, which is not attached, cannot resolve or route to postgres.
  internal:
    internal: true
  # Outbound-only network for the backup sidecar's off-box restic target.
  egress: {}

volumes:
  caddy_data:
  caddy_config:
  images:
  pgdata:
  backups:
