name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: lint · typecheck · build · test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: snapping_turtle_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app -d snapping_turtle_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://app:ci-only-password@127.0.0.1:5432/snapping_turtle_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from package.json#packageManager
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:integration
      - name: Install Playwright Chromium
        run: pnpm --filter @snapping-turtle/web exec playwright install --with-deps chromium
      - run: pnpm test:parity
      - name: Extension smoke tests (built Chrome extension)
        run: pnpm --filter @snapping-turtle/extension test:smoke
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
      - name: Upload extension zips
        uses: actions/upload-artifact@v4
        with:
          name: extension-zips
          path: extension/dist/*.zip
          retention-days: 14

  docker:
    name: docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: snapping-turtle/app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
