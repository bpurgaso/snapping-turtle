# Dependabot (PLAN.md §12 "Operational"): weekly, grouped so a review is one
# PR per ecosystem rather than thirty. Every PR still has to pass the full
# CI contract — including pnpm audit and the Trivy image scans — before it
# is mergeable. Major bumps of security-sensitive runtime pieces are left
# to a human on purpose (Fabric.js: renderer parity contract, PLAN §10;
# sharp/argon2: native binaries; Fastify: the whole HTTP surface).
# Groups apply to version updates only (the default `applies-to`): security
# updates stay one PR per advisory so they are never held behind a batch.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        dependency-type: development
      runtime-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      - dependency-name: fabric
        update-types: [version-update:semver-major]
      - dependency-name: sharp
        update-types: [version-update:semver-major]
      - dependency-name: argon2
        update-types: [version-update:semver-major]
      - dependency-name: fastify
        update-types: [version-update:semver-major]
      # Toolchain majors are migrations, not bumps: TypeScript majors have to
      # move with typescript-eslint/tsx/vitest support (TS 7 is the Go
      # compiler); @types/node must track the runtime major in .nvmrc and the
      # NODE_IMAGE the app image is built from, never lead it.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  # One weekly PR for all workflow actions (CI-only, no runtime exposure);
  # a major of any of them lands in the same PR and is reviewed there.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      ci-actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Stateful: a Postgres major is a dump/restore migration of the data
      # volume, done by hand per deploy/README.md "Upgrading Postgres across a
      # major version" — never a mergeable bump. Minors/patches still flow.
      - dependency-name: postgres
        update-types: [version-update:semver-major]
