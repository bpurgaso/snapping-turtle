<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>suggestions: heavy DOM perf fixture</title>
    <!--
      Structure pre-scan (E11), performance: thousands of elements. A dense
      dashboard fills the viewport — a 10 × 6 grid of borderless tiles (items
      by repetition), each with 35 descendant nodes, and a 20 × 20 table — so
      well over two thousand elements are inside the viewport and must be
      described in full. A feed of 300 cards × 15 nodes starts at the fold:
      the first card crosses it and is read, the rest are off-viewport — each
      is peeked (bounds only) and its subtree skipped.
      A display:none menu of 500 nodes is skipped outright. The spec asserts
      the scan completes within its budgets and prints the measured numbers.
    -->
    <style>
      html,
      body {
        margin: 0;
        background: #fff;
        color: #222;
        font:
          11px/1.3 system-ui,
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      p,
      span,
      div {
        margin: 0;
      }
      /* Tiles 112 × 72 with 8 px gaps and padding: the dashboard is 1208 × 488 at 36,16. */
      #dash {
        position: absolute;
        left: 36px;
        top: 16px;
        display: grid;
        grid-template-columns: repeat(10, 112px);
        grid-auto-rows: 72px;
        gap: 8px;
        padding: 8px;
      }
      .tile {
        overflow: hidden;
      }
      .tile span {
        display: inline-block;
        width: 9px;
        height: 9px;
      }
      #table {
        position: absolute;
        left: 36px;
        top: 500px;
        border-collapse: collapse;
      }
      #table td {
        width: 60px;
        height: 10px;
        padding: 0;
      }
      #feed {
        position: absolute;
        left: 36px;
        top: 700px;
        width: 600px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .post {
        width: 600px;
        height: 100px;
      }
      #menu {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="dash"></div>
    <table id="table"></table>
    <div id="feed"></div>
    <div id="menu"></div>
    <script>
      const dash = document.getElementById('dash');
      for (let t = 0; t < 60; t++) {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.id = 'tile-' + t;
        // 35 descendants: a title, a row of 4 groups × (1 div + 7 spans) = 32, plus two more.
        const title = document.createElement('p');
        title.textContent = 'Tile ' + t;
        tile.append(title);
        for (let g = 0; g < 4; g++) {
          const group = document.createElement('div');
          for (let s = 0; s < 7; s++) {
            const dot = document.createElement('span');
            dot.textContent = String((g * 7 + s) % 10);
            group.append(dot);
          }
          tile.append(group);
        }
        const foot = document.createElement('p');
        foot.textContent = 'footer';
        const note = document.createElement('p');
        note.textContent = 'note';
        tile.append(foot, note);
        dash.append(tile);
      }
      const table = document.getElementById('table');
      for (let r = 0; r < 20; r++) {
        const row = document.createElement('tr');
        for (let c = 0; c < 20; c++) {
          const cell = document.createElement('td');
          cell.textContent = r * 20 + c;
          row.append(cell);
        }
        table.append(row);
      }
      const feed = document.getElementById('feed');
      for (let i = 0; i < 300; i++) {
        const post = document.createElement('div');
        post.className = 'post';
        for (let n = 0; n < 14; n++) {
          const line = document.createElement('p');
          line.textContent = 'post ' + i + ' line ' + n;
          post.append(line);
        }
        feed.append(post);
      }
      const menu = document.getElementById('menu');
      for (let i = 0; i < 500; i++) {
        const item = document.createElement('div');
        item.textContent = 'hidden ' + i;
        menu.append(item);
      }
      window.__heavy = {
        elements: document.getElementsByTagName('*').length,
        inViewport: [...document.getElementsByTagName('*')].filter((el) => {
          const r = el.getBoundingClientRect();
          return r.bottom > 0 && r.top < innerHeight && r.right > 0 && r.left < innerWidth;
        }).length,
      };
    </script>
  </body>
</html>
